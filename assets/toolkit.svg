<svg width="1200" height="286" viewBox="0 0 1200 286" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Technical toolkit — languages, product and systems, data and operations, cloud and integrations">
  <defs>
    <style>
      .mono { font-family: ui-monospace,'SF Mono','Cascadia Mono','Consolas',monospace; }
    </style>
  </defs>

  <rect width="1200" height="286" fill="#E7E0CF"/>
  <rect x="0.5" y="0.5" width="1199" height="285" fill="none" stroke="#17130B" stroke-width="1" opacity="0.3"/>

  <!-- title -->
  <rect x="64" y="40" width="8" height="8" fill="#C24326"/>
  <text class="mono" x="82" y="48" font-size="13" letter-spacing="2" fill="#17130B">TECHNICAL TOOLKIT</text>
  <text class="mono" x="252" y="48" font-size="11" letter-spacing="1" fill="#726A57">what I build and operate with</text>
  <line x1="64" y1="62" x2="1136" y2="62" stroke="#17130B" stroke-width="1" opacity="0.2"/>

  <!-- rows: label (muted mono caps) + content (ink mono) -->
  <g class="mono">
    <!-- Core -->
    <text x="64" y="104" font-size="10.5" letter-spacing="1.5" fill="#726A57">CORE</text>
    <text x="248" y="104" font-size="12" fill="#17130B">TypeScript &#183; Go &#183; Python &#183; Rust &#183; SQL &#183; Node.js &#183; FastAPI</text>
    <line x1="64" y1="122" x2="1136" y2="122" stroke="#17130B" stroke-width="1" opacity="0.1"/>

    <!-- Product & Systems -->
    <text x="64" y="152" font-size="10.5" letter-spacing="1.5" fill="#726A57">PRODUCT &amp; SYSTEMS</text>
    <text x="248" y="152" font-size="12" fill="#17130B">React &#183; Next.js &#183; React Native &#183; Tauri &#183; real-time terminals &#183; order execution &#183; LLM gateways &#183; streaming APIs</text>
    <line x1="64" y1="170" x2="1136" y2="170" stroke="#17130B" stroke-width="1" opacity="0.1"/>

    <!-- Data & Operations -->
    <text x="64" y="200" font-size="10.5" letter-spacing="1.5" fill="#726A57">DATA &amp; OPERATIONS</text>
    <text x="248" y="200" font-size="12" fill="#17130B">PostgreSQL &#183; Redis / Redis Streams &#183; MongoDB &#183; Kafka &#183; Redpanda &#183; observability &#183; incidents &amp; recovery &#183; billing &amp; entitlements</text>
    <line x1="64" y1="218" x2="1136" y2="218" stroke="#17130B" stroke-width="1" opacity="0.1"/>

    <!-- Cloud & Integrations -->
    <text x="64" y="248" font-size="10.5" letter-spacing="1.5" fill="#726A57">CLOUD &amp; INTEGRATIONS</text>
    <text x="248" y="248" font-size="12" fill="#17130B">AWS &#183; ECS &#183; EC2 &#183; RDS &#183; KMS &#183; Amplify &#183; Docker &#183; Kubernetes &#183; Nomad &#183; OpenAI &#183; Anthropic &#183; broker &amp; banking APIs</text>
  </g>
</svg>
