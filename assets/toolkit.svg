<svg width="1200" height="250" viewBox="0 0 1200 250" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Toolkit — languages, systems, and platform I reach for">
  <defs>
    <pattern id="t25" width="16" height="16" patternUnits="userSpaceOnUse" shape-rendering="crispEdges">
      <rect x="0" y="0" width="4" height="4" fill="#17130B"/><rect x="8" y="0" width="4" height="4" fill="#17130B"/>
      <rect x="0" y="8" width="4" height="4" fill="#17130B"/><rect x="8" y="8" width="4" height="4" fill="#17130B"/>
    </pattern>
    <style>
      .mono { font-family: ui-monospace,'SF Mono','Consolas',monospace; }
      .pill { font-family: ui-monospace,'SF Mono','Consolas',monospace; fill:#17130B; }
    </style>
  </defs>

  <rect width="1200" height="250" fill="#E7E0CF"/>
  <rect x="0.5" y="0.5" width="1199" height="249" fill="none" stroke="#17130B" stroke-width="1" opacity="0.3"/>

  <!-- title -->
  <rect x="64" y="40" width="8" height="8" fill="#C24326"/>
  <text class="mono" x="82" y="48" font-size="13" letter-spacing="2" fill="#17130B">TOOLKIT</text>
  <text class="mono" x="168" y="48" font-size="11" letter-spacing="1" fill="#726A57">what I reach for</text>
  <line x1="64" y1="62" x2="1136" y2="62" stroke="#17130B" stroke-width="1" opacity="0.2"/>

  <!-- row: languages -->
  <rect x="64" y="88" width="10" height="16" fill="url(#t25)"/>
  <text class="mono" x="84" y="101" font-size="11" letter-spacing="1.5" fill="#726A57">LANGUAGES</text>
  <g class="pill" font-size="13" text-anchor="middle">
    <rect x="190" y="86" width="38"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="209" y="103">Go</text>
    <rect x="240" y="86" width="102" height="26" rx="2" fill="none" stroke="#17130B"/><text x="291" y="103">TypeScript</text>
    <rect x="354" y="86" width="54"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="381" y="103">Rust</text>
    <rect x="420" y="86" width="70"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="455" y="103">Python</text>
    <rect x="502" y="86" width="46"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="525" y="103">SQL</text>
  </g>

  <!-- row: systems -->
  <rect x="64" y="136" width="10" height="16" fill="url(#t25)"/>
  <text class="mono" x="84" y="149" font-size="11" letter-spacing="1.5" fill="#726A57">SYSTEMS</text>
  <g class="pill" font-size="13" text-anchor="middle">
    <rect x="190" y="134" width="102" height="26" rx="2" fill="none" stroke="#17130B"/><text x="241" y="151">PostgreSQL</text>
    <rect x="304" y="134" width="62"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="335" y="151">Redis</text>
    <rect x="378" y="134" width="126" height="26" rx="2" fill="none" stroke="#17130B"/><text x="441" y="151">Redis Streams</text>
    <rect x="516" y="134" width="70"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="551" y="151">WebRTC</text>
    <rect x="598" y="134" width="118" height="26" rx="2" fill="none" stroke="#17130B"/><text x="657" y="151">event-driven</text>
    <rect x="728" y="134" width="246" height="26" rx="2" fill="none" stroke="#17130B"/><text x="851" y="151">idempotency &amp; reconciliation</text>
  </g>

  <!-- row: platform -->
  <rect x="64" y="184" width="10" height="16" fill="url(#t25)"/>
  <text class="mono" x="84" y="197" font-size="11" letter-spacing="1.5" fill="#726A57">PLATFORM</text>
  <g class="pill" font-size="13" text-anchor="middle">
    <rect x="190" y="182" width="46"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="213" y="199">AWS</text>
    <rect x="248" y="182" width="70"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="283" y="199">Docker</text>
    <rect x="330" y="182" width="62"  height="26" rx="2" fill="none" stroke="#17130B"/><text x="361" y="199">CI/CD</text>
    <rect x="404" y="182" width="126" height="26" rx="2" fill="none" stroke="#17130B"/><text x="467" y="199">OpenTelemetry</text>
  </g>
</svg>
