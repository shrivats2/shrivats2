<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shrivats Krishna Shrivastav — founder-engineer, systems on the critical path">
  <defs>
    <!-- ordered (Bayer 4x4) dither tiles, cell = 4px -->
    <pattern id="d25" width="16" height="16" patternUnits="userSpaceOnUse" shape-rendering="crispEdges">
      <rect x="0" y="0" width="4" height="4" fill="#17130B"/><rect x="8" y="0" width="4" height="4" fill="#17130B"/>
      <rect x="0" y="8" width="4" height="4" fill="#17130B"/><rect x="8" y="8" width="4" height="4" fill="#17130B"/>
    </pattern>
    <pattern id="d50" width="16" height="16" patternUnits="userSpaceOnUse" shape-rendering="crispEdges">
      <rect x="0" y="0" width="4" height="4" fill="#17130B"/><rect x="8" y="0" width="4" height="4" fill="#17130B"/>
      <rect x="4" y="4" width="4" height="4" fill="#17130B"/><rect x="12" y="4" width="4" height="4" fill="#17130B"/>
      <rect x="0" y="8" width="4" height="4" fill="#17130B"/><rect x="8" y="8" width="4" height="4" fill="#17130B"/>
      <rect x="4" y="12" width="4" height="4" fill="#17130B"/><rect x="12" y="12" width="4" height="4" fill="#17130B"/>
    </pattern>
    <pattern id="d75" width="16" height="16" patternUnits="userSpaceOnUse" shape-rendering="crispEdges">
      <rect x="0" y="0" width="4" height="4" fill="#17130B"/><rect x="4" y="0" width="4" height="4" fill="#17130B"/><rect x="8" y="0" width="4" height="4" fill="#17130B"/><rect x="12" y="0" width="4" height="4" fill="#17130B"/>
      <rect x="4" y="4" width="4" height="4" fill="#17130B"/><rect x="12" y="4" width="4" height="4" fill="#17130B"/>
      <rect x="0" y="8" width="4" height="4" fill="#17130B"/><rect x="4" y="8" width="4" height="4" fill="#17130B"/><rect x="8" y="8" width="4" height="4" fill="#17130B"/><rect x="12" y="8" width="4" height="4" fill="#17130B"/>
      <rect x="4" y="12" width="4" height="4" fill="#17130B"/><rect x="12" y="12" width="4" height="4" fill="#17130B"/>
    </pattern>
    <style>
      .name { font-family: 'Arial Narrow','Helvetica Neue',Arial,sans-serif; font-weight: 800; fill:#17130B; letter-spacing:-1px; }
      .mono { font-family: ui-monospace,'SF Mono','Cascadia Mono','Consolas',monospace; }
    </style>
  </defs>

  <!-- paper -->
  <rect width="1200" height="320" fill="#E7E0CF"/>

  <!-- crop marks -->
  <g stroke="#17130B" stroke-width="1" opacity="0.55">
    <path d="M32 48 V32 H48" fill="none"/>
    <path d="M1168 48 V32 H1152" fill="none"/>
    <path d="M32 272 V288 H48" fill="none"/>
    <path d="M1168 272 V288 H1152" fill="none"/>
  </g>

  <!-- top register line -->
  <g class="mono" font-size="11" letter-spacing="1.5" fill="#726A57">
    <text x="64" y="53">PROFILE / SHRIVATS2</text>
    <text x="1136" y="53" text-anchor="end">REV 2026.07</text>
  </g>

  <!-- name -->
  <text class="name" x="62" y="152" font-size="66">SHRIVATS KRISHNA</text>
  <text class="name" x="62" y="216" font-size="66">SHRIVASTAV</text>

  <!-- tagline -->
  <text class="mono" x="64" y="250" font-size="14" letter-spacing="0.5" fill="#413B2E">FOUNDER-ENGINEER · SYSTEMS ON THE CRITICAL PATH</text>

  <!-- rule -->
  <line x1="64" y1="270" x2="1136" y2="270" stroke="#17130B" stroke-width="1" opacity="0.35"/>

  <!-- spec fields -->
  <g class="mono" font-size="12" letter-spacing="0.4" fill="#59513F">
    <text x="64" y="292">AI INFRASTRUCTURE / FINTECH EXECUTION</text>
    <rect x="452" y="283.5" width="9" height="9" fill="#C24326"/>
    <text x="468" y="292" fill="#413B2E">OPERATING IN STEALTH</text>
    <text x="672" y="292">BASED IN INDIA</text>
  </g>

  <!-- ordered-dither tone scale (the 'knows the metal' detail) -->
  <g>
    <rect x="820" y="64" width="316" height="168" fill="#E7E0CF" stroke="#17130B" stroke-width="1"/>
    <rect x="820" y="64" width="63.2" height="168" fill="#E7E0CF"/>
    <rect x="883.2" y="64" width="63.2" height="168" fill="url(#d25)"/>
    <rect x="946.4" y="64" width="63.2" height="168" fill="url(#d50)"/>
    <rect x="1009.6" y="64" width="63.2" height="168" fill="url(#d75)"/>
    <rect x="1072.8" y="64" width="63.2" height="168" fill="#17130B"/>
    <g stroke="#17130B" stroke-width="1" opacity="0.3">
      <line x1="883.2" y1="64" x2="883.2" y2="232"/>
      <line x1="946.4" y1="64" x2="946.4" y2="232"/>
      <line x1="1009.6" y1="64" x2="1009.6" y2="232"/>
      <line x1="1072.8" y1="64" x2="1072.8" y2="232"/>
    </g>
  </g>
  <g class="mono" font-size="10" letter-spacing="1" fill="#726A57">
    <text x="820" y="248">0</text>
    <text x="978" y="248" text-anchor="middle">ORDERED DITHER · 1-BIT</text>
    <text x="1136" y="248" text-anchor="end">1</text>
  </g>
</svg>
