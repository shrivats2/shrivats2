<svg width="1200" height="440" viewBox="0 0 1200 440" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Control plane / data plane separation for a streaming AI gateway">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0C1421"/>
      <stop offset="1" stop-color="#0A111C"/>
    </linearGradient>
    <linearGradient id="flow" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#14E3C7"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <pattern id="g2" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#42566E" fill-opacity="0.16"/>
    </pattern>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <style>
      @keyframes dash2 { to { stroke-dashoffset: -400 } }
      .path { stroke-dasharray: 6 10; animation: dash2 5s linear infinite }
      .lbl  { font-family: ui-monospace,'SF Mono','Consolas',monospace; fill:#8496AE; letter-spacing:.4px }
      .h    { font-family:'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif; font-weight:700 }
      .chip { font-family:'Segoe UI',-apple-system,Arial,sans-serif; fill:#D6E0EC; font-weight:600 }
      .zone { font-family: ui-monospace,'SF Mono',monospace; letter-spacing:1.5px; font-size:11px }
    </style>
  </defs>

  <rect width="1200" height="440" rx="18" fill="url(#card)"/>
  <rect width="1200" height="440" rx="18" fill="url(#g2)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="18" fill="none" stroke="#1E2B3D" stroke-width="1"/>

  <!-- zone bands -->
  <rect x="24" y="60" width="1152" height="150" rx="12" fill="#0E1A2A" stroke="#173247" stroke-width="1"/>
  <rect x="24" y="250" width="1152" height="150" rx="12" fill="#0E1622" stroke="#20303F" stroke-width="1"/>
  <text class="zone" x="44" y="86" fill="#14E3C7">CONTROL&#160;PLANE</text>
  <text class="lbl" x="176" y="86" font-size="11" fill="#5C7186">policy, identity, accounting — off the hot path</text>
  <text class="zone" x="44" y="276" fill="#38BDF8">DATA&#160;PLANE</text>
  <text class="lbl" x="164" y="276" font-size="11" fill="#5C7186">streamed bytes — low added latency</text>

  <!-- title -->
  <text class="h" x="44" y="40" font-size="18" fill="#EAF1F9">Separating the control plane from the request data plane</text>

  <!-- control plane nodes -->
  <g filter="url(#soft)">
    <g>
      <rect x="60"  y="110" width="180" height="72" rx="10" fill="#122236" stroke="#1C3A52"/>
      <rect x="290" y="110" width="180" height="72" rx="10" fill="#122236" stroke="#1C3A52"/>
      <rect x="520" y="110" width="180" height="72" rx="10" fill="#122236" stroke="#1C3A52"/>
      <rect x="750" y="110" width="180" height="72" rx="10" fill="#122236" stroke="#1C3A52"/>
      <rect x="980" y="110" width="160" height="72" rx="10" fill="#122236" stroke="#1C3A52"/>
    </g>
  </g>
  <g class="chip" font-size="14" text-anchor="middle">
    <text x="150" y="141">Auth &amp; Tenancy</text>
    <text x="380" y="141">Budgets &amp; Limits</text>
    <text x="610" y="141">Metering</text>
    <text x="840" y="141">Routing Policy</text>
    <text x="1060" y="141">Audit</text>
  </g>
  <g class="lbl" font-size="10.5" text-anchor="middle" fill="#6A7F96">
    <text x="150" y="162">keys · scopes · RBAC</text>
    <text x="380" y="162">spend caps · rate</text>
    <text x="610" y="162">reserve → finalize</text>
    <text x="840" y="162">health-aware</text>
    <text x="1060" y="162">immutable log</text>
  </g>

  <!-- data plane pipeline -->
  <g filter="url(#soft)">
    <rect x="60"  y="300" width="150" height="66" rx="10" fill="#0F2530" stroke="#1D4A55"/>
    <rect x="330" y="300" width="150" height="66" rx="10" fill="#0F2530" stroke="#1D4A55"/>
    <rect x="600" y="300" width="150" height="66" rx="10" fill="#0F2530" stroke="#1D4A55"/>
    <rect x="870" y="300" width="150" height="66" rx="10" fill="#0F2530" stroke="#1D4A55"/>
  </g>
  <g class="chip" font-size="14" text-anchor="middle">
    <text x="135" y="330">Client</text>
    <text x="405" y="330">Gateway</text>
    <text x="675" y="330">Provider(s)</text>
    <text x="945" y="330">Stream</text>
  </g>
  <g class="lbl" font-size="10.5" text-anchor="middle" fill="#6A7F96">
    <text x="135" y="350">request / cancel</text>
    <text x="405" y="350">streaming proxy</text>
    <text x="675" y="350">failover fallback</text>
    <text x="945" y="350">reconcile on close</text>
  </g>

  <!-- data plane flow arrows -->
  <g stroke="url(#flow)" stroke-width="2" fill="none">
    <path d="M210 333 H330"/>
    <path class="path" d="M210 333 H330" stroke="#BFFCF0" stroke-width="1.4"/>
    <path d="M480 333 H600"/>
    <path class="path" d="M480 333 H600" stroke="#BFFCF0" stroke-width="1.4"/>
    <path d="M750 333 H870"/>
    <path class="path" d="M750 333 H870" stroke="#BFFCF0" stroke-width="1.4"/>
  </g>
  <g fill="#7FFFE8">
    <circle r="3"><animateMotion dur="5s" repeatCount="indefinite" path="M210 333 H330"/></circle>
    <circle r="3" fill="#38BDF8"><animateMotion dur="5s" begin="1s" repeatCount="indefinite" path="M480 333 H600"/></circle>
    <circle r="3"><animateMotion dur="5s" begin="2s" repeatCount="indefinite" path="M750 333 H870"/></circle>
  </g>

  <!-- control ↔ data coupling (dashed, off-path) -->
  <g stroke="#2A4256" stroke-width="1.4" stroke-dasharray="4 5" fill="none" opacity="0.9">
    <path d="M405 300 V182"/>
    <path d="M675 300 C 675 240, 610 220, 610 182"/>
    <path d="M405 300 C 405 250, 380 220, 380 182"/>
    <path d="M945 300 C 945 240, 1060 220, 1060 182"/>
  </g>
  <g fill="#3E566B" class="lbl" font-size="10" text-anchor="middle">
    <text x="500" y="250">decisions, not bytes</text>
  </g>

  <!-- footer note -->
  <text class="lbl" x="44" y="424" font-size="10.5" fill="#4C6076">Generalized industry pattern · synthetic illustration · not any specific production system</text>
</svg>
