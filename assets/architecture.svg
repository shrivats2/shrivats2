<svg width="1200" height="470" viewBox="0 0 1200 470" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Figure 1 — control plane / data plane separation">
  <defs>
    <pattern id="a25" width="16" height="16" patternUnits="userSpaceOnUse" shape-rendering="crispEdges">
      <rect x="0" y="0" width="4" height="4" fill="#17130B"/><rect x="8" y="0" width="4" height="4" fill="#17130B"/>
      <rect x="0" y="8" width="4" height="4" fill="#17130B"/><rect x="8" y="8" width="4" height="4" fill="#17130B"/>
    </pattern>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#C24326"/>
    </marker>
    <style>
      .h  { font-family:'Arial Narrow','Helvetica Neue',Arial,sans-serif; font-weight:700; fill:#17130B; }
      .t  { font-family:'Helvetica Neue',Arial,sans-serif; font-weight:700; fill:#17130B; }
      .m  { font-family: ui-monospace,'SF Mono','Consolas',monospace; fill:#726A57; }
    </style>
  </defs>

  <rect width="1200" height="470" fill="#E7E0CF"/>
  <rect x="0.5" y="0.5" width="1199" height="469" fill="none" stroke="#17130B" stroke-width="1" opacity="0.25"/>

  <!-- crop marks -->
  <g stroke="#17130B" stroke-width="1" opacity="0.5">
    <path d="M28 44 V28 H44" fill="none"/><path d="M1172 44 V28 H1156" fill="none"/>
    <path d="M28 426 V442 H44" fill="none"/><path d="M1172 426 V442 H1156" fill="none"/>
  </g>

  <!-- title + tone key -->
  <text class="m" x="64" y="52" font-size="12" letter-spacing="1.5" fill="#413B2E">FIG.1 — CONTROL PLANE / DATA PLANE SEPARATION</text>
  <g class="m" font-size="10" letter-spacing="1" fill="#726A57">
    <text x="1136" y="46" text-anchor="end">KEY</text>
    <rect x="1064" y="52" width="24" height="12" fill="url(#a25)" stroke="#17130B" stroke-width="0.75"/>
    <text x="1058" y="61" text-anchor="end">CONTROL</text>
    <rect x="1096" y="52" width="24" height="12" fill="#17130B"/>
    <text x="1124" y="61">DATA</text>
  </g>

  <!-- CONTROL PLANE band -->
  <rect x="48" y="76" width="1104" height="150" fill="none" stroke="#17130B" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <rect x="48" y="76" width="10" height="150" fill="url(#a25)"/>
  <text class="m" x="72" y="98" font-size="12" letter-spacing="2" fill="#17130B">CONTROL PLANE</text>
  <text class="m" x="212" y="98" font-size="11" fill="#8A816B">policy · identity · accounting — off the hot path</text>

  <g class="h" font-size="15" text-anchor="middle">
    <g><rect x="64"  y="118" width="176" height="70" fill="#E7E0CF" stroke="#17130B" stroke-width="1"/><text x="152" y="150">Auth &amp; Tenancy</text></g>
    <g><rect x="288" y="118" width="176" height="70" fill="#E7E0CF" stroke="#17130B" stroke-width="1"/><text x="376" y="150">Budgets &amp; Limits</text></g>
    <g><rect x="512" y="118" width="176" height="70" fill="#E7E0CF" stroke="#17130B" stroke-width="1"/><text x="600" y="150">Metering</text></g>
    <g><rect x="736" y="118" width="176" height="70" fill="#E7E0CF" stroke="#17130B" stroke-width="1"/><text x="824" y="150">Routing Policy</text></g>
    <g><rect x="960" y="118" width="176" height="70" fill="#E7E0CF" stroke="#17130B" stroke-width="1"/><text x="1048" y="150">Audit</text></g>
  </g>
  <g class="m" font-size="11" text-anchor="middle" fill="#8A816B">
    <text x="152" y="171">keys · scopes · rbac</text>
    <text x="376" y="171">spend caps · rate</text>
    <text x="600" y="171">reserve → finalize</text>
    <text x="824" y="171">health-aware</text>
    <text x="1048" y="171">append-only log</text>
  </g>

  <!-- coupling -->
  <g stroke="#17130B" stroke-width="1" stroke-dasharray="3 5" opacity="0.4">
    <line x1="152"  y1="300" x2="152"  y2="188"/>
    <line x1="451"  y1="300" x2="451"  y2="188"/>
    <line x1="749"  y1="300" x2="749"  y2="188"/>
    <line x1="1048" y1="300" x2="1048" y2="188"/>
  </g>
  <text class="m" x="600" y="248" font-size="11" letter-spacing="2" text-anchor="middle" fill="#8A816B">DECISIONS, NOT BYTES</text>

  <!-- DATA PLANE band -->
  <rect x="48" y="264" width="1104" height="140" fill="none" stroke="#17130B" stroke-width="1" stroke-dasharray="2 4" opacity="0.6"/>
  <rect x="48" y="264" width="10" height="140" fill="#17130B"/>
  <text class="m" x="72" y="286" font-size="12" letter-spacing="2" fill="#17130B">DATA PLANE</text>
  <text class="m" x="190" y="286" font-size="11" fill="#8A816B">streamed bytes — low added latency</text>

  <g class="t" font-size="15" text-anchor="middle">
    <g><rect x="64"  y="300" width="176" height="64" fill="#E7E0CF" stroke="#17130B" stroke-width="1.25"/><text x="152" y="330">Client</text></g>
    <g><rect x="363" y="300" width="176" height="64" fill="#E7E0CF" stroke="#17130B" stroke-width="1.25"/><text x="451" y="330">Gateway</text></g>
    <g><rect x="661" y="300" width="176" height="64" fill="#E7E0CF" stroke="#17130B" stroke-width="1.25"/><text x="749" y="330">Provider(s)</text></g>
    <g><rect x="960" y="300" width="176" height="64" fill="#E7E0CF" stroke="#17130B" stroke-width="1.25"/><text x="1048" y="330">Stream</text></g>
  </g>
  <g class="m" font-size="11" text-anchor="middle" fill="#8A816B">
    <text x="152" y="350">request / cancel</text>
    <text x="451" y="350">streaming proxy</text>
    <text x="749" y="350">failover fallback</text>
    <text x="1048" y="350">reconcile on close</text>
  </g>

  <!-- the critical path: the one thing that pops -->
  <g stroke="#C24326" stroke-width="1.75" fill="none">
    <line x1="248" y1="332" x2="357" y2="332" marker-end="url(#ah)"/>
    <line x1="547" y1="332" x2="655" y2="332" marker-end="url(#ah)"/>
    <line x1="845" y1="332" x2="954" y2="332" marker-end="url(#ah)"/>
  </g>

  <text class="m" x="64" y="428" font-size="10.5" letter-spacing="0.5" fill="#9A917A">GENERALIZED PATTERN · SYNTHETIC ILLUSTRATION · NOT ANY SPECIFIC PRODUCTION SYSTEM</text>
</svg>
